[package]
name = "scribely"
version = "0.1.0"
description = "Scribely — whiteboard animation for macOS"
authors = ["Scribely"]
edition = "2021"
rust-version = "1.77"

# The library is what `main.rs` (and the mobile entry point) call into.
[lib]
name = "scribely_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
